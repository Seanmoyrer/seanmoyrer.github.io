    </div>
    <div class="form-container">
      <ul>
        <h1>Feedback Form</h1>
        
        <form action="/submit-feedback" method="POST">



            <div class="form-name">
             <label id="name-label" for="name">Full Name:</label>
             <input type="text" id="name" name="fullname" placeholder="Full Name" required autofocus>
         </div>

         <div class="form-email">
             <label id="email-label" for="email">Email Address:</label>
             <input type="email" id="email" name="email" placeholder="Your Email" required>
         </div>

            <div class="form-category">
                <label for="category">Feedback Category:</label>
                <select id="category" name="category" required>
                    <option value="" disabled selected>Select a category...</option>
                    <option value="bug">Report a Bug</option>
                    <option value="suggestion">Suggest a Feature</option>
                    <option value="compliment">Compliment</option>
                    <option value="other">Other</option>
                </select>
            </div>
        
            <div class="form-feedback">
                 <label for="feedback">Share Your Thoughts</label>
                <textarea id="feedback" rows="10" cols="60" 
                  placeholder="Tell us how we can improve/Give us your compliment" required></textarea>
            </div>
            <button type="submit">Submit Feedback</button>

        </form>

        </ul>
    </div>
